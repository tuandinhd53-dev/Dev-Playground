        <meta charset="UTF-8" />

        <!-- Reset Styles -->
        <link rel="stylesheet" href="assets/css/resets.css" />

        <!-- Embed Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

            rel="stylesheet"
        />

        <!-- Styles Css-->

        <link rel="stylesheet" href="assets/css/styles.css" />
    </head>
    <body>
        <!-- Header -->
        <header class="header">
            <div class="container">
                <div class="header__inner">
                    <!-- Logo -->

                    <a href="#!">
                        <img
                            class="logo"
                            src="./assets/img/logo.png"
                            alt="Lucy"
                        />
                    </a>

                    <!-- Navigation -->
                    <nav class="nav">
                        <ul class="nav__list">
                            <li class="nav__item">
                                <a class="nav__link" href="#!">Home</a>
                            </li>
                            <li class="nav__item">
                                <a class="nav__link" href="#!">About</a>
                            </li>
                            <li class="nav__item">
                                <a class="nav__link" href="#!"
                                    >Services & Rates</a
                                >
                            </li>
                            <li class="nav__item">
                                <a class="nav__link" href="#!">Reviewa</a>
                            </li>
                            <li class="nav__item">
                                <a class="nav__link" href="#!">Contacts us</a>
                            </li>
                        </ul>
                    </nav>

                    <!--Header Action -->

                    <div class="header__action">
                        <a class="header__action-link" href="#!">Sign In</a>
                        <a class="header__action-btn btn" href="#!">Sign Up</a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Hero -->

        <section class="hero">
            <div class="container">
                <div class="hero__inner">
                    <!-- Hero Media -->
                    <div class="hero__media">
                        <div class="hero__img--wrap">
                            <img
                                src="./assets/img/pet01.png"
                                alt="cat"
                                class="hero__img"
                            />

                            <!--Decoratosr -->
                            <img
                                src="./assets/img/decor1.svg"
                                alt="decor1"
                                class="hero__decor-1"
                            />
                            <img
                                src="./assets/img/decor2.svg"
                                alt="decor2"
                                class="hero__decor-2"
                            />
                        </div>

                        <div class="hero__img--wrap hero__img--wrap-smail">
                            <img
                                src="./assets/img/pet02.png"
                                alt="cat"
                                class="hero__img"
                            />
                        </div>

                        <div class="hero__item">
                            <!-- Hero Item List 1 -->

                            <section class="hero__item--list">
                                <img
                                    src="./assets/img/pet03.png"
                                    alt="pet3"
                                    class="hero__item--list-thumb"
                                />
                                <div class="hero__item--list_info">
                                    <p class="hero__item--list-title">
                                        Pet Health
                                    </p>
                                    <div
                                        class="hero__item--list-skeleton"
                                    ></div>
                                    <div
                                        class="hero__item--list-skeleton"
                                        style="--width: 39px"
                                    ></div>
                                </div>
                            </section>

                            <div class="hero__item--separate"></div>

                            <!-- Hero Item List 2 -->

                            <section class="hero__item--list">
                                <img
                                    src="./assets/img/pet04.png"
                                    alt="pet4"
                                    class="hero__item--list-thumb"
                                />
                                <div class="hero__item--list_info">
                                    <p class="hero__item--list-title">
                                        Pet Health
                                    </p>
                                    <div
                                        class="hero__item--list-skeleton"
                                    ></div>
                                    <div
                                        class="hero__item--list-skeleton"
                                        style="--width: 39px"
                                    ></div>
                                </div>
                            </section>
                        </div>
                    </div>

                    <!-- Hero Content -->
                    <div class="hero__content">
                        <h1 class="hero__heading">
                            Established & Trusted Pet Care Service
                        </h1>
                        <p class="hero__desc">
                            Discover a wide variety of Pawsitive services to
                            choose from, including daycare, private walks,
                            office duty and spa.
                        </p>

                        <div class="hero__contact"></div>
                    </div>
                </div>
            </div>
        </section>
    </body>
</html>
